; Raises PHP-FPM's per-directory upload limits to match this app's own
; stated 5MB-per-file cap (see StorePelamarRequest / onFileSelected in
; resources/views/public/show.blade.php). Without this, PHP's own default
; (2M/8M here) silently rejects files the app itself tells applicants are
; allowed, before Laravel validation ever runs.
upload_max_filesize = 6M
post_max_size = 64M
